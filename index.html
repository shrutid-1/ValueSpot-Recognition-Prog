    <!--
      Two type systems, deliberately.

      Barlow / Barlow Condensed carry BOTH portals now. The administrative
      screens (HR, Manager) use them as they always have; the Employee portal
      uses Barlow Condensed at 700, uppercase, for every title and figure —
      the condensed poster voice the panel layout is built around.

      Archivo carries the Employee interface voice: navigation, labels,
      metadata and the recognition stories themselves.

      Michroma carries the ValueSpot wordmark and nothing else. It is the closest
      web font to the Eurostile Extended of the Touchcore logo the wordmark is
      built to match: square bowls, monoline strokes, very wide. One weight,
      used at one place on a screen.

      Fraunces was dropped with the editorial design that needed it. It was a
      variable font loaded across four weights and nothing references it any
      more.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;500;600;700&family=Archivo:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet" />
